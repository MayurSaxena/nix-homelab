# Static, and covering only the machines OpenTofu declares.
#
# Disposable guests -- CTF boxes, research VMs -- are deliberately absent: they take DHCP,
# they come and go, and one that wants a playbook run can take it with `-i <address>,` and no
# entry here. If that ever stops being enough, community.general.proxmox provides an
# inventory plugin that can filter on the `lab` pool. Do not build that until something needs it.
all:
  children:
    windows:
      vars:
        ansible_connection: ssh
        ansible_user: Administrator
        # Required for Windows targets over SSH. Without it Ansible sends POSIX shell syntax
        # to PowerShell and every task fails with parse errors that name nothing useful.
        ansible_shell_type: powershell
      children:
        domain_controllers:
          hosts:
            lab-dc01:
              ansible_host: 10.0.90.10
        domain_members:
          hosts: {}
        workstations:
          hosts: {}
        analysis:
          hosts:
            flare01:
              ansible_host: 10.0.90.50

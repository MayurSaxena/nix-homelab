---
# Everything a Linux lab guest needs that its cloud image did not already provide.
#
# The list is deliberately short. A distribution cloud image arrives with cloud-init, a
# working network and a sane user, which is most of what a Packer template would have been
# built to supply -- so this role exists to close the gaps, not to build a machine.
#
# One rule governs most of what follows: **on Kali, a package installed after the image was
# built arrives disabled.** /usr/lib/systemd/system-preset/99-default.preset is
# `disable *.service` and 95-kali.preset is the whitelist, so dpkg's preset policy switches
# off anything the whitelist does not name. Every `enabled: true` below is therefore
# load-bearing rather than belt-and-braces, and any package added here needs the same
# treatment.

- name: Install the QEMU guest agent
  # Not supplied by the image, despite it being a cloud image: Kali's genericcloud build
  # ships without qemu-guest-agent, so Proxmox attaches the virtio port and nothing ever
  # answers on it. The visible symptoms are a guest that reports no IP in the Proxmox
  # summary and takes the full timeout on every shutdown.
  #
  # This is deliberately here rather than in cloud-init's `packages:`. Adding packages
  # would mean a custom user-data snippet, and Proxmox's cicustom REPLACES the user-data it
  # generates rather than adding to it -- taking the administrator password and the SSH
  # keys with it. One package is not worth re-implementing cloud-init's user handling and
  # putting a password in a snippet on the node.
  ansible.builtin.apt:
    name: qemu-guest-agent
    state: present
    update_cache: true
    cache_valid_time: 3600
  become: true
  notify: Start the guest agent

- name: Ensure the guest agent is enabled and running
  ansible.builtin.systemd_service:
    name: qemu-guest-agent
    enabled: true
    state: started
  become: true


- name: Ensure netplan's backend-configuration unit is enabled
  # Without this the guest loses its address on every boot after the first, and is then
  # reachable only from the Proxmox console.
  #
  # The chain is worth knowing, because none of it is a bug in anything:
  #
  #   1. Proxmox's cloud-init defaults ciupgrade on, so first boot dist-upgrades the image.
  #   2. That takes netplan from 1.1.2 to 1.2.1.
  #   3. netplan 1.2 deliberately moved .network/.link generation OUT of its systemd
  #      generator (which now only validates and writes unit symlinks) and into this new
  #      netplan-configure.service.
  #   4. The unit is new to the system, so dpkg defers to the preset policy -- and Kali's
  #      base-files ships `disable *.service`, with the whitelist in 95-kali.preset
  #      predating netplan 1.2. So it installs disabled and nothing generates the config.
  #
  # First boot works anyway because cloud-init applies the network itself for a new
  # instance, then writes /run/cloud-init/.skip-network and correctly stays out of the way
  # afterwards. So the failure is invisible on the boot that creates the machine.
  #
  # Ordering matters and this unit has it right: Before=systemd-networkd.service, in
  # sysinit.target, which also keeps network-online.target meaningful.
  ansible.builtin.systemd_service:
    name: netplan-configure.service
    enabled: true
  become: true

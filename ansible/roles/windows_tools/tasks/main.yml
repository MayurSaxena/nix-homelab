---
# A curated security toolset on a stock Windows install.
#
# Deliberately not FLARE-VM. That installer rewrites a great deal of Windows -- Defender
# off, Explorer settings, a reboot loop -- which is right for a dedicated malware box and
# wrong for a machine that should stay representative of a normal domain-joined workstation.
# flare01 is the other box; see the flare_vm role.

- name: Prepare the console login for the Npcap setup step
  ansible.windows.win_powershell:
    sensitive_parameters:
      - name: Credential
        username: Administrator
        password: '{{ lookup("community.sops.sops", lab_secrets_file, extract=''["clone-admin-password"]'') | trim }}'
    script: |
      param([PSCredential]$Credential)
      Set-LocalUser -Name Administrator -Password $Credential.Password
  no_log: true

- name: Stage the free Npcap installer for interactive template preparation
  ansible.windows.win_get_url:
    url: https://npcap.com/dist/npcap-1.89.exe
    dest: C:\Windows\Temp\npcap-setup.exe
    checksum: 8aed85e900d783d1308506e919587d3e540451947af8a82f2d04f819e44305cc
    checksum_algorithm: sha256

- name: Explain the one-time packet capture setup
  ansible.builtin.debug:
    msg: >-
      Log into this build VM's console as Administrator with clone-admin-password and run
      C:\Windows\Temp\npcap-setup.exe. Complete and close its wizard. Packer waits for
      Npcap before capture; every clone inherits the installed driver.

- name: Install the security toolset
  chocolatey.chocolatey.win_chocolatey:
    name: "{{ windows_tools_packages }}"
    state: present
    timeout: "{{ windows_tools_timeout }}"
  register: choco_result
  # Chocolatey exits 3010 when a package wants a reboot, which is success plus a note.
  failed_when: >-
    (choco_result.rc is defined and choco_result.rc not in [0, 3010]) or
    (choco_result.rc is not defined and choco_result is failed)

- name: Reboot when a tool installer requests it
  ansible.windows.win_reboot:
  when: choco_result.rc | default(0) | int == 3010

- name: Read installed Chocolatey packages
  chocolatey.chocolatey.win_chocolatey_facts:
    filter: [packages]

- name: Verify the requested tool packages are installed
  ansible.builtin.assert:
    that:
      - windows_tools_packages | difference(ansible_facts.chocolatey.packages | map(attribute='package') | list) | length == 0
    fail_msg: Some requested CTF tool packages are missing; do not capture this image.

- name: Download the Nmap installer for extraction
  ansible.windows.win_get_url:
    url: 'https://nmap.org/dist/nmap-{{ windows_tools_nmap_version }}-setup.exe'
    dest: 'C:\Windows\Temp\nmap-{{ windows_tools_nmap_version }}-setup.exe'
    checksum: '{{ windows_tools_nmap_checksum }}'
    checksum_algorithm: sha256

- name: Extract Nmap from the NSIS installer with 7-Zip
  # The NSIS installer hangs indefinitely in headless Session 0 regardless of
  # execution context (/S, runas SYSTEM, async). NSIS packages are archives;
  # 7-Zip extracts them without running the installer.
  ansible.windows.win_shell: |
    $installer = 'C:\Windows\Temp\nmap-{{ windows_tools_nmap_version }}-setup.exe'
    $dest = 'C:\Program Files (x86)\Nmap'
    $tmp = "$env:TEMP\nmap-extract"
    if (Test-Path $tmp) { Remove-Item $tmp -Recurse -Force }
    & 'C:\Program Files\7-Zip\7z.exe' x $installer "-o$tmp" -y
    if ($LASTEXITCODE -ne 0) { throw "7-Zip extraction failed ($LASTEXITCODE)" }
    $src = if (Test-Path "$tmp\`$INSTDIR") { "$tmp\`$INSTDIR" } else { $tmp }
    if (-not (Test-Path $dest)) { New-Item -ItemType Directory -Path $dest | Out-Null }
    Copy-Item "$src\*" -Destination $dest -Recurse -Force
    Get-ChildItem $dest -Directory | Where-Object { $_.Name -match '^\$' } |
      Remove-Item -Recurse -Force
    Remove-Item $tmp -Recurse -Force
    if (-not (Test-Path "$dest\nmap.exe")) { throw 'nmap.exe not found after extraction' }
  args:
    creates: 'C:\Program Files (x86)\Nmap\nmap.exe'

- name: Verify Nmap starts
  ansible.windows.win_command:
    argv: ['C:\Program Files (x86)\Nmap\nmap.exe', '--version']
  changed_when: false

- name: Add Nmap to the machine PATH
  ansible.windows.win_path:
    elements: ['C:\Program Files (x86)\Nmap']
    scope: machine
    state: present

- name: Put Sysinternals on PATH for every user
  # The package drops the suite in a directory that is not on PATH, so `procmon` from a
  # shell fails and the tools get run by hunting for the .exe instead. This is the single
  # difference between "installed" and "usable".
  ansible.windows.win_path:
    elements:
      - '%ChocolateyInstall%\lib\sysinternals\tools'
    scope: machine
    state: present

- name: Accept the Sysinternals EULA ahead of first run
  # Every Sysinternals tool blocks on a EULA dialog the first time it runs, per user. On a
  # box driven over SSH that is an invisible hang rather than a prompt.
  ansible.windows.win_regedit:
    path: HKCU:\Software\Sysinternals
    name: EulaAccepted
    data: 1
    type: dword
    state: present

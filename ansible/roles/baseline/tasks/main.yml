---
# Runs on every Windows guest, and is the first thing to touch a fresh clone. Its job is to
# take the machine off the bootstrap password and make it addressable, in that order.

# The key and the ACL are baked into the template by install-openssh.ps1, so there is nothing
# to install here. The role still asserts the state it depends on, because the whole class of
# failure this lab has produced is a thing that looks configured and is not.

- name: Ensure sshd is running and starts at boot
  ansible.windows.win_service:
    name: sshd
    state: started
    start_mode: auto

# No hostname task. Cloudbase-init already sets it, and the log proves it:
#
#   cloudconfigplugins.set_hostname [-] Changing hostname to 'dc01'
#
# Proxmox writes `hostname:` into user-data as cloud-config, and cloudbase-init's cloud-config
# handler acts on it even though SetHostNamePlugin's own metadata lookup (local-hostname, from
# meta-data) finds nothing. An earlier version of this role set the hostname itself and
# triggered a reboot to apply it; both were doing work already done.

- name: Set the timezone
  ansible.windows.win_timezone:
    timezone: "{{ baseline_timezone }}"

- name: Enable RDP
  ansible.windows.win_regedit:
    path: HKLM:\System\CurrentControlSet\Control\Terminal Server
    name: fDenyTSConnections
    data: 0
    type: dword
  when: baseline_enable_rdp

- name: Open RDP in the firewall
  community.windows.win_firewall_rule:
    name: "Remote Desktop (TCP-In)"
    localport: 3389
    action: allow
    direction: in
    protocol: tcp
    state: present
    enabled: true
  when: baseline_enable_rdp

- name: Check whether this is evaluation media
  ansible.windows.win_shell: |
    (Get-CimInstance SoftwareLicensingProduct -Filter "PartialProductKey IS NOT NULL AND ApplicationId='55c92734-d682-4d71-983e-d6ec3f16059f'").Description
  register: _lic
  changed_when: false

# Off by default; see the note in defaults/main.yml. When enabled, //Nologo rather than //B:
# //B suppresses slmgr's output entirely, so a failure arrives as rc=1 with empty stdout and
# nothing to distinguish "already rearmed" from a real error.
- name: Rearm the evaluation period
  ansible.windows.win_shell: cscript //Nologo C:\Windows\System32\slmgr.vbs /rearm
  when:
    - baseline_rearm_evaluation
    - "'EVAL' in (_lic.stdout | upper)"
  register: _rearm
  failed_when:
    - _rearm.rc != 0
    - "'exceeded' not in ((_rearm.stdout | default('')) | lower)"
    - "'maximum' not in ((_rearm.stdout | default('')) | lower)"
  changed_when: _rearm.rc == 0

# The guest agent is how Proxmox reports a VM's address and shuts it down cleanly, and a
# broken one is invisible until tofu hangs on destroy. Assert rather than assume.
- name: Confirm the QEMU guest agent is running
  ansible.windows.win_service_info:
    name: QEMU-GA
  register: _ga
  failed_when: _ga.services | length == 0 or _ga.services[0].state != 'started'

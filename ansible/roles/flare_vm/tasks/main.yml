---
# Mandiant's FLARE-VM, on its own machine and nowhere else.
#
# This is not a package list. The installer disables Defender and Windows Update, changes
# Explorer and UAC settings, and reboots several times over the better part of an hour. That
# is correct for a malware analysis box and unacceptable on a machine you also want to be a
# representative domain member, which is why ctf01 exists separately with windows_tools.
#
# It is also not idempotent in any useful sense: it is a one-shot bootstrap. The guard below
# is what keeps this role safe to leave in site.yml, and the reason the real "put it back how
# it was" mechanism for this box is `just lab-revert flare01` rather than re-running Ansible.

- name: Read the local administrator password
  # Read at run time rather than stored in group_vars, so nothing here is a credential.
  # FLARE-VM's installer needs it to set up its own autologon across the reboots it does.
  ansible.builtin.set_fact:
    flare_admin_password: >-
      {{ lookup('community.sops.sops', lab_secrets_file, extract='["clone-admin-password"]') | trim }}
  no_log: true

- name: Check whether FLARE-VM is already installed
  ansible.windows.win_stat:
    path: 'C:\ProgramData\chocolatey\lib\flarevm.installer.vm'
  register: flare_marker

- name: Warn that Defender will be disabled
  ansible.builtin.debug:
    msg: >-
      Installing FLARE-VM on {{ inventory_hostname }}. This disables Defender and Windows
      Update, reboots several times, and takes roughly an hour. Take a golden snapshot
      afterwards with `just lab-snapshot {{ inventory_hostname }}`.
  when: not flare_marker.stat.exists or flare_vm_force

- name: Install FLARE-VM
  when: not flare_marker.stat.exists or flare_vm_force
  block:
    - name: Fetch the installer
      ansible.windows.win_get_url:
        url: "{{ flare_vm_url }}"
        dest: 'C:\Windows\Temp\flare-install.ps1'

    - name: Run the installer unattended
      # -noWait is deliberately NOT used: the play should own the install rather than
      # detaching and reporting success while it is still going.
      ansible.windows.win_shell: >-
        powershell.exe -ExecutionPolicy Bypass -File C:\Windows\Temp\flare-install.ps1
        -password '{{ flare_admin_password }}' -noWait:$false -noGui
      args:
        creates: 'C:\ProgramData\chocolatey\lib\flarevm.installer.vm'
      # The installer reboots the box out from under us more than once.
      async: 7200
      poll: 60
      register: flare_install
      failed_when:
        - flare_install.rc is defined
        - flare_install.rc not in [0, 3010]

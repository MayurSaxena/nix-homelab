---
# Image-build only. Boxstarter owns installer reboots; Packer's retryable, read-only
# wait-tool-image.ps1 owns the completion gate. An async job ID is never installation success.
- name: Require an isolated FLARE image build
  ansible.builtin.assert:
    that:
      - tool_image | default('') == 'flare'
      - inventory_hostname == 'tool-image'
    fail_msg: Build FLARE with the workstation Packer pipeline, not on a persistent guest.

- name: Check Defender tamper protection before changing the FLARE image
  ansible.windows.win_powershell:
    script: |
      $Ansible.Changed = $false
      $tamper = (Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows Defender\Features' -Name TamperProtection -ErrorAction SilentlyContinue).TamperProtection
      if ($tamper -eq 5) {
          throw 'Tamper Protection is enabled. Disable it on this dedicated FLARE build VM before installing; do not weaken the shared Windows base or CTF image.'
      }

- name: Disable Defender through policy on the FLARE build only
  ansible.windows.win_regedit:
    path: '{{ item.path }}'
    name: '{{ item.name }}'
    data: 1
    type: dword
  loop:
    - {path: 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender', name: DisableAntiSpyware}
    - {path: 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\Real-Time Protection', name: DisableRealtimeMonitoring}
  register: flare_defender_policy

- name: Reboot after setting FLARE Defender policy
  ansible.windows.win_reboot:
  when: flare_defender_policy.changed

- name: Verify Defender is stopped before launching upstream installer
  ansible.windows.win_powershell:
    script: |
      $Ansible.Changed = $false
      if ((Get-Service WinDefend -ErrorAction SilentlyContinue).Status -eq 'Running') {
          throw 'Defender remains running; FLARE prerequisites are not met.'
      }

- name: Create image build status directory
  ansible.windows.win_file:
    path: C:\ProgramData\Lab
    state: directory

- name: Fetch pinned FLARE installer
  ansible.windows.win_get_url:
    url: '{{ flare_vm_url }}'
    dest: C:\Windows\Temp\flare-install.ps1
    checksum: '{{ flare_vm_checksum }}'
    checksum_algorithm: sha256

- name: Fetch matching FLARE configuration
  ansible.windows.win_get_url:
    url: '{{ flare_vm_config_url }}'
    dest: C:\Windows\Temp\flare-config.xml
    checksum: '{{ flare_vm_config_checksum }}'
    checksum_algorithm: sha256

- name: Initialize the bounded FLARE installation status
  ansible.windows.win_powershell:
    script: |
      $ErrorActionPreference = 'Stop'
      foreach ($path in @('C:\ProgramData\_VM\failed_packages.txt', 'C:\ProgramData\Lab\flare-started.txt')) {
          if (Test-Path $path) { throw 'This is not a clean FLARE build. Start from a new base clone.' }
      }
      [DateTime]::UtcNow.ToString('o') | Set-Content C:\ProgramData\Lab\flare-started.txt
      if ($PSVersionTable.PSVersion.Major -lt 5) { throw 'FLARE requires PowerShell 5 or newer' }
      if ((Get-Volume -DriveLetter C).Size -lt 60GB) { throw 'FLARE requires at least a 60 GB system volume' }
      Set-ExecutionPolicy Unrestricted -Scope LocalMachine -Force

- name: Launch the reboot-resilient upstream installer
  ansible.windows.win_powershell:
    sensitive_parameters:
      - name: Credential
        username: Administrator
        password: '{{ lookup("community.sops.sops", lab_secrets_file, extract=''["clone-admin-password"]'') | trim }}'
    script: |
      param([PSCredential]$Credential)
      $ErrorActionPreference = 'Stop'
      try {
          # This is a bare Packer clone, so there is no per-guest metadata password yet.
          Set-LocalUser -Name Administrator -Password $Credential.Password
          # The upstream check UI still calls Read-Host with -noGui (including its
          # snapshot prompt). Packer supplies a disposable full clone, and the play
          # validates Windows/workstation, PowerShell, disk and Defender prerequisites.
          & C:\Windows\Temp\flare-install.ps1 -password ($Credential.GetNetworkCredential().Password) -noWait -noGui -noChecks -customConfig C:\Windows\Temp\flare-config.xml
          if ($LASTEXITCODE -notin @(0, 3010)) { throw 'Installer returned a failure status' }
      } catch {
          'FLARE installer failed; inspect guest installer logs.' | Set-Content C:\ProgramData\Lab\flare-failed.txt
          throw
      }
  async: 7200
  poll: 0
  no_log: true

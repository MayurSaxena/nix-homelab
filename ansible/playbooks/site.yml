---
# Everything, in dependency order. Safe to run repeatedly: a second run should report zero
# changed tasks, and one that does not is a bug rather than noise.

- name: Baseline every Linux guest
  hosts: linux
  gather_facts: true
  roles:
    - linux_baseline

- name: Install a desktop and RDP where it is wanted
  hosts: linux_desktop
  gather_facts: true
  roles:
    - linux_remote_desktop

- name: Baseline every Windows guest
  hosts: windows
  gather_facts: true
  roles:
    - baseline

- name: Build the forest
  hosts: domain_controllers
  gather_facts: true
  roles:
    - domain_controller

# CTF and FLARE tools are installed while building their templates (tool-image.yml).
# Persistent guests receive only per-guest baseline changes here. Updating a tool image
# does not mutate existing guests: rebuild the selected guest explicitly when desired.

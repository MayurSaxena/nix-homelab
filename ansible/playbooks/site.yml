---
# Everything, in dependency order. Safe to run repeatedly: a second run should report zero
# changed tasks, and one that does not is a bug rather than noise.

- name: Baseline every Linux guest
  hosts: linux
  gather_facts: true
  roles:
    - linux_baseline

- name: Baseline every Windows guest
  hosts: windows
  gather_facts: true
  roles:
    - baseline

- name: Build the forest
  hosts: domain_controllers
  gather_facts: true
  roles:
    - domain_controller

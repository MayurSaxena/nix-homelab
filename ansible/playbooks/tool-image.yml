---
# Packer supplies an isolated inventory. Never point this play at a persistent workstation.
- name: Build a reusable Windows tool image
  hosts: windows
  gather_facts: true
  vars_files:
    - ../group_vars/all.yml
  pre_tasks:
    - name: Validate the requested image
      ansible.builtin.assert:
        that:
          - tool_image in ['ctf', 'flare']
          - ansible_facts.os_family == 'Windows'
          - inventory_hostname == 'tool-image'
        fail_msg: Tool images must be built on standalone Windows clones.
    - name: Refuse domain members and servers as tool-image sources
      ansible.windows.win_powershell:
        script: |
          $Ansible.Changed = $false
          if ((Get-CimInstance Win32_ComputerSystem).DomainRole -ne 0) {
              throw 'Expected a standalone Windows workstation'
          }
  roles:
    - baseline
  tasks:
    - name: Install the CTF toolset
      ansible.builtin.include_role:
        name: windows_tools
      when: tool_image == 'ctf'

    - name: Install FLARE-VM
      ansible.builtin.include_role:
        name: flare_vm
      when: tool_image == 'flare'

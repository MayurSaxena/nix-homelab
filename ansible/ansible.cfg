# Ansible for the lab's non-NixOS guests. See LAB.md.

[defaults]
inventory = inventory.yml
roles_path = roles
# The lab is rebuilt constantly and its host keys change every time a VM is recreated, so a
# known_hosts file here would be a permanent source of false alarms. Kept out of the user's
# real known_hosts for the same reason.
host_key_checking = False
interpreter_python = auto_silent
# `stdout_callback = yaml` selects community.general.yaml, which was removed in that
# collection's version 12. The replacement is the built-in callback with a format option.
result_format = yaml
# Windows modules are chatty; retry files add nothing when every host is reproducible.
retry_files_enabled = False

[ssh_connection]
# Windows sshd does not support the ControlMaster multiplexing Ansible assumes by default,
# and leaving it on produces connection errors that look like authentication failures.
ssh_args = -o ControlMaster=no -o ControlPersist=no -o PreferredAuthentications=publickey,password
pipelining = False
